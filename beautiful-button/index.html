<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            padding: 18px 36px;
            border: 1px solid #CCCCCC;
            color: #D1FAE5;
            background: #059669;
            font-size: 24px;
            transition: background .15s ease-in;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            border-radius: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #047857;
        }
        button:active {
             background: #065f46;
        }
    </style>
</head>
<body>
   <button>Click Me! :)</button> 
</body>
</html>
